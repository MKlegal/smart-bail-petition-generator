<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>Smart Bail Petition Generator Widget</title>
    <meta name="robots" content="noindex, nofollow"> <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        /* Widget Specific Overrides */
        body {
            background-color: transparent !important; /* Makes it blend with WordPress */
            padding: 0 !important;
            margin: 0 !important;
            overflow-x: hidden;
        }
        .container {
            max-width: 100% !important;
            padding: 10px !important;
            margin: 0 !important;
        }
        .widget-wrapper {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 20px;
        }
        /* Hide any residual layout spacing */
        .two-columns { display: block; margin: 0; }
        .main-content { width: 100%; max-width: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <main style="padding: 0;">
        <div class="container">
            
            <div class="widget-wrapper main-content">
                
                <div class="tabs" id="tabs" style="margin-top: 0;">
                    <button class="tab-btn active" data-tab="post">📄 497 CrPC (Post-Arrest)</button>
                    <button class="tab-btn" data-tab="pre">🛡️ 498 CrPC (Pre-Arrest)</button>
                    <button class="tab-btn" data-tab="protective">✈️ Protective Bail</button>
                    <button class="tab-btn" data-tab="cancellation">❌ Bail Cancellation</button>
                </div>

                <div class="form-panel" id="formPanel"></div>

                <div class="preview-panel">
                    <h3 style="margin-top: 0;">📜 Live Preview (Exact Court Format)</h3>
                    <div id="livePreview" class="preview-content">Select petition type and fill details...</div>
                    <div class="action-buttons">
                        <button class="btn-outline" id="copyBtn">📋 Copy Draft</button>
                        <button class="btn-download" id="downloadBtn">⬇️ Download Word (.doc)</button>
                    </div>
                    <button class="btn-generate" id="generateBtn">✨ Generate &amp; Refresh Preview</button>
                </div>

            </div>
            </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
